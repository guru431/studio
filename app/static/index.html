<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1b1b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Студия">
<title>Студия</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/static/css/app.css?v={{v}}">
<link rel="stylesheet" href="/static/css/code-desktop.css?v={{v}}">
<link rel="stylesheet" id="hl-paper" href="/static/vendor/hl-paper.css?v={{v}}" media="(prefers-color-scheme: light)">
<link rel="stylesheet" id="hl-graphite" href="/static/vendor/hl-graphite.css?v={{v}}" media="(prefers-color-scheme: dark)">
<script src="/static/theme.js?v={{v}}"></script>
<script type="module" src="/static/js/lock-start.js?v={{v}}"></script>
<script src="/static/vendor/marked.min.js?v={{v}}" defer></script>
<script src="/static/vendor/purify.min.js?v={{v}}" defer></script>
<script src="/static/vendor/highlight.min.js?v={{v}}" defer></script>
<script type="module" src="/static/js/app.js?v={{v}}"></script>
</head>
<body class="shell">
<nav id="rail" aria-label="Разделы">
  <img class="logo" src="/static/icons/icon.svg" alt="">
  <a class="tab" href="#/chat" data-section="chat"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Чат</span></a>
  <a class="tab" href="#/photo" data-section="photo"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg><span>Фото</span></a>
  <a class="tab" href="#/video" data-section="video"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg><span>Видео</span></a>
  <a class="tab" href="#/speech" data-section="speech"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg><span>Речь</span></a>
  <a class="tab" href="#/transcribe" data-section="transcribe"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg><span>Разговоры</span></a>
  <a class="tab" href="#/ocr" data-section="ocr"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 9h8M8 12h8M8 15h5"/></svg><span>Сканы</span></a>
  <a class="tab" href="#/translate" data-section="translate"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h7M7.5 5v2M5 15c2-2 4-5 4.5-8M6 11c1 2 3 3 5 4"/><path d="M13 20l3.5-8 3.5 8M14.2 17.5h4.6"/></svg><span>Перевод</span></a>
  <a class="tab" href="#/code" data-section="code"><span class="tab-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6l5 5-5 5M11 18h9"/></svg><span id="code-running-count" class="tab-count" aria-hidden="true" hidden></span></span><span>Агенты</span></a>
  <span class="spacer"></span>
  <a id="search-open" class="search-toggle" href="#/search" data-section="search" aria-label="Поиск" title="Поиск"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></a>
  <button id="jobs" class="jobs-toggle" type="button" aria-haspopup="dialog" aria-controls="jobs-panel" aria-label="В работе" title="В работе"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h7"/><path d="M15.5 16.5l2 2 3.5-4"/></svg><span class="jobs-count" hidden></span><span class="jobs-dot" hidden></span></button>
  <button id="avatar" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="Настройки и выход"></button>
</nav>
<div id="menu" class="menu" role="menu" hidden>
  <div class="menu-who"><b id="menu-name"></b><span id="menu-login"></span></div>
  <button id="theme-toggle" class="menu-item menu-theme" role="menuitem" type="button"></button>
  <div id="appearance-controls" class="appearance-controls" role="group" aria-label="Шрифт и масштаб"></div>
  <a class="menu-item" role="menuitem" href="#/settings">Настройки</a>
  <a class="menu-item" role="menuitem" href="#/admin" id="menu-admin" hidden>Панель</a>
  <form method="post" action="/logout"><button class="menu-item" role="menuitem" id="menu-logout" type="submit">Выход</button></form>
</div>
<main id="view"></main>
<dialog id="jobs-panel" class="jobs-panel" aria-labelledby="jobs-title">
  <div class="jobs-sheet">
    <div class="jobs-head"><h2 id="jobs-title">В работе</h2><button id="jobs-close" class="btn-link" type="button">Закрыть</button></div>
    <h3>Идёт</h3>
    <ul id="jobs-running" class="jobs-list"></ul>
    <h3>Готово за час</h3>
    <ul id="jobs-finished" class="jobs-list"></ul>
  </div>
</dialog>
<dialog id="curtain" class="curtain" closedby="none" aria-label="Студия скрыта"><img class="lock-logo" src="/static/icons/icon.svg" alt=""></dialog>
<dialog id="lock" class="lock" closedby="none" aria-labelledby="lock-title">
  <img class="lock-logo" src="/static/icons/icon.svg" alt="">
  <h1 id="lock-title">Студия заперта</h1>
  <button id="lock-open" class="btn btn-accent" type="button">Открыть</button>
  <div id="lock-pin" class="lock-pin" hidden>
    <div id="lock-pin-dots" class="lock-pin-dots" aria-label="Набранные цифры PIN"></div>
    <div class="lock-pin-pad">
      <button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button>
      <button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button>
      <button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button>
      <button id="lock-pin-back" type="button" aria-label="Стереть">⌫</button><button type="button" data-digit="0">0</button><button id="lock-pin-ok" type="button" disabled>OK</button>
    </div>
  </div>
  <button id="lock-use-password" class="btn-link" type="button">Открыть паролем</button>
  <form id="lock-password-form" class="lock-password" hidden>
    <input id="lock-password" class="input" type="password" autocomplete="current-password" maxlength="1024" aria-label="Пароль учётки" placeholder="Пароль учётки">
    <button id="lock-password-go" class="btn" type="submit">Открыть</button>
  </form>
  <button id="lock-use-pin" class="btn-link" type="button" hidden>Открыть PIN-кодом</button>
  <p id="lock-status" class="status" aria-live="polite"></p>
  <form method="post" action="/logout"><button id="lock-logout" class="btn-link" type="submit">Выйти</button></form>
</dialog>
</body>
</html>
