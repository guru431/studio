<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Студия — вход</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f4f5; --fg: #18181b; --card: #fff; --line: #d4d4d8; --accent: #2563eb; --bad: #b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #18181b; --fg: #f4f4f5; --card: #27272a; --line: #3f3f46; --accent: #60a5fa; --bad: #f87171; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; width: min(320px, calc(100vw - 32px)); display: grid; gap: 12px; }
  h1 { margin: 0; font-size: 20px; }
  input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  button { background: var(--accent); color: #fff; border: 0; cursor: pointer; }
  .error { color: var(--bad); min-height: 1.4em; margin: 0; }
</style>
</head>
<body>
<form method="post" action="login">
  <h1>Студия</h1>
  <input type="password" name="token" placeholder="Токен (ключ шлюза)" autocomplete="current-password" maxlength="512" required autofocus>
  <button type="submit">Войти</button>
  <p class="error">{{error}}</p>
</form>
<script>
// Переход по ссылке с другого сайта не несёт cookie SameSite=Strict — служба отдала вход при
// живой сессии. Запрос со своей страницы cookie несёт: 200 или 404 (задания нет) — сессия жива,
// перейти на студию. Метка ?relogin — один раз: без cookie и там вышел бы снова вход, не цикл.
(() => {
  if (location.search.includes("relogin")) return;
  fetch("api/jobs/current", { credentials: "same-origin" })
    .then((r) => { if (r.status === 200 || r.status === 404) location.replace("./?relogin"); })
    .catch(() => {});
})();
</script>
</body>
</html>
