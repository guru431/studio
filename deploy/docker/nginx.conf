worker_processes 1;
pid /tmp/nginx.pid;
# Proxy errors can contain request URLs. Application events are logged by the web service.
error_log /dev/null crit;
events { worker_connections 512; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    upstream studio { server unix:/run/studio/web.sock; }
    server {
        listen 8080;
        # This is the only trusted public reverse proxy. Never accept LAN-wide access.
        allow 10.77.1.10;
        deny all;
        client_max_body_size 210m;
        location / {
            proxy_pass http://studio;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # Preserve Apache's final address; adding our own would break login throttling.
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
    server {
        listen 127.0.0.1:8081;
        location = /health { access_log off; return 200 'ok'; }
        location / { return 404; }
    }
}
