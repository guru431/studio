# Студия — https://llm.example.com/studio/ (служба studio-web на этом же debian, unix-сокет).
#
# Подключается ВНУТРИ TLS-vhost llm.example.com (`<VirtualHost *:8443>` в
# /opt/services/apache/llm-0-55.conf — копия llm_routers dashboard/deploy/apache-vhost.conf) строкой
#
#     IncludeOptional /opt/services/studio/deploy/apache-location.conf
#
# Именно в TLS-vhost: cookie сессии выдаётся с флагом Secure. Файл приезжает выкладкой
# (deploy/deploy.sh); после его правки — `sudo apache2ctl configtest && sudo systemctl reload apache2`.
#
# Имя «studio-backend» в правой части ProxyPass — ключ воркера mod_proxy, а не DNS: с
# `http://localhost/studio/` запрос мог уехать в чужой сокет, объявленный корневым воркером
# `|http://localhost/` (так /teacher/ уезжал в сокет univer_dashboard, teacher 2026-08-20).
# Префикс /studio не срезается — маршруты приложения объявлены с ним.

RedirectMatch permanent ^/studio$ /studio/

<Location /studio/>
    # Только LAN и туннели (как панель LLM). Роутер исключён: из дома запрос на публичный адрес
    # приходит с него (петля), а снаружи имени нет. Дальше — вход самой страницы ключом шлюза;
    # попытки она считает по последнему элементу X-Forwarded-For — его дописывает этот Apache.
    <RequireAll>
        Require ip 10.77.1.0/24 example0/24 10.10.49.0/24 10.10.50.0/24
        Require not ip 10.77.1.1
    </RequireAll>
    # Генерация — фоновое задание, страница его опрашивает: запросы короткие, ожидание карты
    # видно в статусе страницы, а не в долгом запросе.
    ProxyPass        unix:/run/studio/web.sock|http://studio-backend/studio/ timeout=120
    ProxyPassReverse unix:/run/studio/web.sock|http://studio-backend/studio/
    RequestHeader set X-Forwarded-Proto "https"
    # Картинка для видео — до 20 МБ, фото для правки — до 10 МиБ с маской: 21 МиБ — с запасом на
    # multipart, не меньше предела службы (image_upload.VIDEO_UPLOAD + 128 КиБ; сверяет
    # tests/test_studio.py).
    LimitRequestBody 22020096
    # Один X-Frame-Options на ответ: два конфликтующих значения часть браузеров не читает вовсе.
    Header always set X-Frame-Options "DENY"
</Location>
