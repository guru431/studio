# Студия — https://studio.example.com (служба studio-web на этом же debian, unix-сокет).
#
# Подключается из /opt/services/apache/apache2.conf (в конце, рядом с остальными vhost *.example.com)
# строкой
#
#     IncludeOptional /opt/services/studio/deploy/apache-vhost.conf
#
# Файл приезжает выкладкой (deploy/deploy.sh): install.sh проверяет его `apache2ctl -t` и после
# ответа службы всегда делает `systemctl reload apache2` сам.
#
# Адрес открыт в интернет (решение владельца 2026-10-19): ограничений по адресу нет, вход —
# логин и пароль самой студии. Пауза после неверных попыток считается по последнему элементу X-Forwarded-For —
# его дописывает этот Apache (sslh перед ним прозрачный, адрес клиента настоящий).
#
# Имя «studio-backend» в правой части ProxyPass — ключ воркера mod_proxy, а не DNS: с
# `|http://localhost/` запрос мог уехать в чужой сокет, объявленный тем же корневым воркером
# (так /teacher/ уезжал в сокет univer_dashboard, teacher 2026-08-20).
<VirtualHost *:8443>
    ServerName studio.example.com
    CustomLog "/var/log/apache2/studio.example.com(8443)-access.log" combined
    ErrorLog "/var/log/apache2/studio.example.com(8443)-errors.log"

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/example.net/cert.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.net/privkey.pem
    SSLCertificateChainFile  /etc/letsencrypt/live/example.net/chain.pem

    # Поток ответа чата (SSE): холодная gemma-abl молчит до ~290 с до первого токена — служба шлёт
    # `: ping` каждые 15 с, а маршрут держит 600 с. flushpackets и no-gzip — чтобы куски потока
    # уходили в браузер сразу, а не копились в буфере прокси и mod_deflate. Раньше общего
    # ProxyPass: mod_proxy берёт первое совпавшее правило.
    ProxyPass /api/chats/ unix:/run/studio/web.sock|http://studio-backend/api/chats/ timeout=600 flushpackets=on
    ProxyPassReverse /api/chats/ unix:/run/studio/web.sock|http://studio-backend/api/chats/
    SetEnvIf Request_URI "^/api/chats/" no-gzip=1
    # Канал моста Claude Code (WebSocket, вход — ключом устройства): апгрейд соединения и предел 300 с —
    # тишину рвут штатные пинги службы каждые 20 с (uvicorn --ws-ping-interval по умолчанию), так что
    # живой канал под предел не попадает, а мёртвый закрывается. Сверяет tests/test_deploy.py.
    ProxyPass /api/agent/link unix:/run/studio/web.sock|http://studio-backend/api/agent/link upgrade=websocket timeout=300
    ProxyPassReverse /api/agent/link unix:/run/studio/web.sock|http://studio-backend/api/agent/link
    # Раздел Claude Code: поток хода (SSE) — как у чата: ход на компьютере идёт минутами, служба шлёт
    # `: ping` каждые 15 с (claude_code.PING_SEC), маршрут держит 600 с; flushpackets и no-gzip — куски
    # потока сразу в браузер. Прочие запросы раздела — просьбы к мосту до bridge.CALL_SEC 30 с.
    ProxyPass /api/code/ unix:/run/studio/web.sock|http://studio-backend/api/code/ timeout=600 flushpackets=on
    ProxyPassReverse /api/code/ unix:/run/studio/web.sock|http://studio-backend/api/code/
    SetEnvIf Request_URI "^/api/code/" no-gzip=1
    # Создание ролика отвечает после шлюза: исходник на шару (до media.SAVE_TIMEOUT_SEC 45 с), задание
    # шлюзу (120 с), поиск потерянного ответа (20 с) и, если фото тем временем удалили, снятие у шлюза
    # (120 с) — до 305 с подряд; общий предел 150 с оборвал бы его 502 раньше слов службы. Опросы
    # ролика короткие, им больший предел не мешает. Сверяет tests/test_deploy.py.
    ProxyPass /api/videos unix:/run/studio/web.sock|http://studio-backend/api/videos timeout=330
    ProxyPassReverse /api/videos unix:/run/studio/web.sock|http://studio-backend/api/videos
    # Генерация картинок и роликов — фоновое задание, страница его опрашивает: запросы короткие.
    # Предел — больше любого предела службы к шлюзу (освобождение карты — три запроса по 30 с,
    # удаление учётки ждёт её заданий до 90 с, фото с маской — два файла на шару по 45 с; сверяет
    # tests/test_deploy.py): иначе 502 Apache закрыл бы слова службы.
    # Синхронны из речи только голосовой ввод и образец голоса — у каждого общий бюджет операции
    # меньше этого предела (dictation.BUDGET_SEC 120 с, voices.BUDGET_SEC 60 с, затем 504 словами);
    # расшифровка и озвучка — фоновые задания. Свой бюджет больше 150 с — свой ProxyPass выше.
    ProxyPass / unix:/run/studio/web.sock|http://studio-backend/ timeout=150
    ProxyPassReverse / unix:/run/studio/web.sock|http://studio-backend/
    RequestHeader set X-Forwarded-Proto "https"

    # Картинка для видео и документ чата — до 20 МиБ, фото для правки — до 10 МиБ с маской:
    # 21 МиБ — с запасом на multipart, не меньше пределов службы (documents.BODY_MAX,
    # videos.BODY_MAX, image_upload.MAX_BODY + MAX_UPLOAD; сверяет tests/test_deploy.py).
    LimitRequestBody 22020096
    # Вложения агента: 30 МиБ байтов дают 40 МиБ base64; запас на текст и JSON.
    <LocationMatch "^/api/code/agents/[^/]+/projects/[^/]+/chats/[^/]+/(turn|steer)$">
        LimitRequestBody 46137344
    </LocationMatch>
    # Запись для расшифровки — до 200 МиБ (transcripts.UPLOAD_MAX, сверяет tests/test_deploy.py), телом
    # запроса потоком на шару: больший предел — только на этот маршрут, прочим — прежний.
    <LocationMatch "^/api/transcripts$">
        LimitRequestBody 220200960
    </LocationMatch>

    # Один X-Frame-Options на ответ: два конфликтующих значения часть браузеров не читает вовсе.
    Header always set X-Frame-Options "DENY"
    Header always set Strict-Transport-Security "max-age=31536000"
</VirtualHost>
