[pytest]
testpaths = tests
; --durations-min=1: каждый прогон называет тесты дольше секунды (политика быстрого набора)
addopts = -q -m "not integration and not manual" --durations=0 --durations-min=1
timeout = 30
# Имя теста остаётся перед ранним стеком, даже если процесс погибает в teardown Runner.
verbosity_test_cases = 1
faulthandler_timeout = 20
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
tmp_path_retention_policy = failed
markers =
    integration: настоящий git, реестр, PowerShell
    manual: настоящий Claude Code, тратит квоту
