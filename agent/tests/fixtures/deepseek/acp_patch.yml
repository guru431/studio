# Overlay passed to `dsh --profile acp --patch <file>` (probe 2026-11-22, DSH 0.2.2-rc.5): works.
# Built from web_patch.yml: llm-pi-ai and agent-default-model copied as is; acp gets provider/model
# (ACP sessions ignore agent-default-model); mcp-manager is absent from acp, so it is inserted whole.
# locale (web-app only) is dropped: as a plain row it only warns `entry "locale" not found`.
- id: llm-pi-ai
  config:
    providers:
      srvllm:
        displayName: srvllm
        apiKeyEnv: SRVLLM_API_KEY
        api: openai-completions
        baseURL: https://llm.example.com/v1
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: stub-tools
            name: Stub tools
            contextWindow: 131072
            maxTokens: 8192
            reasoningEfforts:
              off:
              high: high
- id: agent-default-model
  config:
    provider: srvllm
    model: stub-tools
    reasoningEffort: high
- id: acp
  config:
    provider: srvllm
    model: stub-tools
- insert:
    - id: mcp-manager
      name: '@deepseek-ai/dsh-mcp-manager'
      inject:
        - credentials
      config:
        servers:
          probe:
            transport: stdio
            command: python
            args:
              - '<HOME>\mcp_echo.py'
            enabled: true
