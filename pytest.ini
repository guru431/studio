; Быстрый набор — голый `pytest` (бюджет 60 с): шлюз подменён, сети нет.
; integration — настоящий браузер или PowerShell; manual — живая приёмка с ключом владельца.
; `-n 4 --dist loadgroup` (pytest-xdist): четыре процесса; integration и manual — одной группой,
; одним процессом по очереди (tests/conftest.py). Один тест без параллели — `-n0`.
; `--durations=0 --durations-min=1` — каждый прогон (и ночной) называет тесты дольше секунды:
; быстрый набор шёл у края бюджета 60 с, а сбои под нагрузкой не называли виновника.
[pytest]
testpaths = tests
addopts = -m "not integration and not manual" -n 4 --dist loadgroup --durations=0 --durations-min=1
timeout = 30
# Стеки напрямую в stderr до os._exit pytest-timeout: xdist теряет захваченный вывод.
faulthandler_timeout = 20
markers =
    integration: настоящий браузер, PowerShell или дольше секунды
    manual: живая приёмка на проде, запускается руками
# tmp_path — только у упавших тестов: три прогона по умолчанию в pytest-of-<user> забивали C: (2026-10-21)
tmp_path_retention_policy = failed
