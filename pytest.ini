; Быстрый набор — голый `pytest` (бюджет 60 с): шлюз подменён, сети нет.
; integration — настоящий браузер или PowerShell; manual — живая приёмка с ключом владельца.
[pytest]
testpaths = tests
addopts = -m "not integration and not manual"
timeout = 30
markers =
    integration: настоящий браузер, PowerShell или дольше секунды
    manual: живая приёмка на проде, запускается руками
