; Быстрый набор — голый `pytest` (бюджет 60 с): шлюз подменён, сети нет.
; integration — настоящий браузер или PowerShell; manual — живая приёмка с ключом владельца.
; `-n 8 --dist loadgroup` (pytest-xdist): восемь процессов; manual — группой `serial`, одним процессом;
; файл integration — целиком в одном процессе, такие файлы — не больше чем в трёх (tests/conftest.py).
; Один тест без параллели — `-n0`.
; `--assert=plain` сокращает сбор в каждом процессе; `--assert=rewrite` включает разбор выражений при сбое.
; Планировщик в conftest.py группирует остальные тесты по файлам, явные группы имеют приоритет.
; Фиксированный предел, не auto; отдельный временный корень Studio задаёт conftest.py.
; `--durations=0 --durations-min=1` — каждый прогон (и ночной) называет тесты дольше секунды:
; быстрый набор шёл у края бюджета 60 с, а сбои под нагрузкой не называли виновника.
[pytest]
testpaths = tests
addopts = -m "not integration and not manual" -n 8 --dist loadgroup --assert=plain --durations=0 --durations-min=1
timeout = 30
# Стеки напрямую в stderr до os._exit pytest-timeout: xdist теряет захваченный вывод.
faulthandler_timeout = 20
markers =
    integration: настоящий браузер, PowerShell или дольше секунды
    manual: живая приёмка на проде, запускается руками
    file_db: studio с файловой SQLite для перезапуска, второго соединения или работы с файлом базы
# tmp_path — только у упавших тестов: три прогона по умолчанию в pytest-of-<user> забивали C: (2026-10-21)
tmp_path_retention_policy = failed
